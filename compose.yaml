services:
  web:
    depends_on:
      - api
    build: ./gt-frontend
    ports:
      - 5173:5173
    environment:
      VITE_API_URL: http://localhost:5000
    develop:
      watch:
        - path: ./gt-frontend/package.json
          action: rebuild
        - path: ./gt-frontend/package-lock.json
          action: rebuild
        - path: ./gt-frontend
          target: /app
          action: sync

  api:
    build: ./gt-backend
    ports:
      - 5000:5000
    env_file:
      - ./gt-backend/.env
    environment:
      PORT: 5000
    develop:
      watch:
        - path: ./gt-backend/package.json
          action: rebuild
        - path: ./gt-backend/package-lock.json
          action: rebuild
        - path: ./gt-backend
          target: /app
          action: sync
